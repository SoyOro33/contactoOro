<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi contacto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .photo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            margin: 5px 0;
            font-size: 28px;
        }

        .company {
            color: #666;
            margin-bottom: 25px;
        }

        .info {
            margin: 12px 0;
            font-size: 16px;
        }

        .info a {
            color: #333;
            text-decoration: none;
        }

        .save-button {
            display: block;
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            background: #000;
            color: white;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
        }

        .save-button:hover {
            opacity: 0.85;
        }

        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="card">

        <img
            src="foto.jpg"
            alt="Foto de contacto"
            class="photo"
        >

        <h1>Orlando Feliciano</h1>

        <div class="company">
            WebYa
        </div>

        <div class="info">
            📞
            <a href="tel:+529844714170">
                +52 984 471 4170
            </a>
        </div>

        <div class="info">
            ✉️
            <a href="mailto:correo@ejemplo.com">
                orlando.feliciano1133@gmail.com
            </a>
        </div>

        <a class="save-button" href="contacto.vcf">
            GUARDAR CONTACTO
        </a>

        <div class="description">
            Pulsa el botón para guardar mis datos
            directamente en tus contactos.
        </div>

    </div>

</body>
</html>
